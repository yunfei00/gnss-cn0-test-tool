[project]
name = "gnss-cn0-test-tool"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["openpyxl==3.1.5", "PySide6==6.11.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.0", "pyinstaller==6.21.0"]

[project.scripts]
gnss-cn0 = "gnss_cn0_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gnss_cn0_tool"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
